packages:
  - apps/*
  - packages/*

# Install scripts are skipped unless a package is listed here. New packages with build scripts fail install
# until reviewed.
allowBuilds:
  # Analytics for swagger-ui-dist only; its install script is not needed and not wanted.
  '@scarf/scarf': false
  # The platform binary comes from an optional dependency (@esbuild/<platform>); the install script only double-checks it.
  esbuild: false

minimumReleaseAgeExclude:
  - happy-dom@20.14.6

overrides:
  # GHSA-q7qp-rjg7-q26m: @nestjs/platform-express pins multer 2.4.0 exactly, fix is 2.5.0. Remove once platform-express pins >= 2.5.0.
  multer: 2.5.0
  # GHSA-6pq8-jhm2-2vcw: express pins qs 6.16.0, fix is 6.16.1. Remove once express resolves qs >= 6.16.1.
  qs: 6.16.1

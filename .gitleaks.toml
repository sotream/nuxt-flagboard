title = "flagboard gitleaks config"

[extend]
useDefault = true

# Only named test files that contain made-up, secret-looking values are allowed here. Everything else is scanned
# in full, including these files' neighbours.
[[allowlists]]
description = "A made-up JWT-shaped string used to check that a JWT is rejected as an API key"
paths = [
  '''apps/api/src/modules/api-keys/api-key\.spec\.ts''',
]

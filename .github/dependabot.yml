version: 2

# Minor and patch updates arrive as one pull request per ecosystem; a major update gets its own, because it is
# the one that needs reading. Security updates are not grouped, so they are never held back by another change.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Follow the Node major in .nvmrc (24, an LTS line); move both together on purpose.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Stay on the LTS Node line used in .nvmrc and CI; odd-numbered majors are not LTS.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    ignore:
      # A PostgreSQL major upgrade needs a data migration; do it deliberately, not from a bot pull request.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']

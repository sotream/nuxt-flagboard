version: 2

# Minor and patch updates arrive as one pull request per ecosystem; a major update gets its own, because it is
# the one that needs reading. Security updates are not grouped, so they are never held back by another change.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-minor-patch:
        update-types: [minor, patch]

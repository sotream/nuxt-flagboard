name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; a job asks for more only if it needs it (none does).
permissions:
  contents: read

# A new push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Throwaway values for the CI database and the app, never real credentials. They differ from .env.example on
# purpose: the API refuses the example values when APP_ENV=prod.
env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ci-only-postgres-password
  PGPASSWORD: ci-only-postgres-password
  POSTGRES_DB: flagboard
  FLAGBOARD_MIGRATOR_PASSWORD: ci-only-migrator-password
  FLAGBOARD_APP_PASSWORD: ci-only-app-password
  APP_ENV: dev
  PORT: 4010
  WEB_ORIGIN: http://localhost:3010
  DATABASE_URL: postgres://flagboard_app:ci-only-app-password@localhost:5432/flagboard
  MIGRATOR_DATABASE_URL: postgres://flagboard_migrator:ci-only-migrator-password@localhost:5432/flagboard
  JWT_ACCESS_SECRET: ci-only-signing-key-0123456789-abcdefghijklmnop
  SEED_ADMIN_EMAIL: admin@example.com
  SEED_ADMIN_PASSWORD: ci-only-admin-password
  SEED_VIEWER_EMAIL: viewer@example.com
  SEED_VIEWER_PASSWORD: ci-only-viewer-password

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, so an old commit with a secret is found too
          persist-credentials: false
      # Pinned by version and digest: a moved tag cannot change what runs here.
      - name: Scan the history
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --no-banner --redact

  static:
    name: Lint, format and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  unit:
    name: Unit and component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  api-e2e:
    name: API tests on PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: flagboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Same as the Docker Compose init script: the two roles in the main and in the `_test` database.
      - name: Create the roles and the test database
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "CREATE DATABASE ${POSTGRES_DB}_test"
          for db in "$POSTGRES_DB" "${POSTGRES_DB}_test"; do
            psql -v ON_ERROR_STOP=1 -h localhost -U "$POSTGRES_USER" -d "$db" \
              -v dbname="$db" \
              -v migrator_password="$FLAGBOARD_MIGRATOR_PASSWORD" \
              -v app_password="$FLAGBOARD_APP_PASSWORD" \
              -f infra/postgres/init-roles.sql
          done
      - run: pnpm test:e2e
      # The compiled server runs against the main database, which the e2e tests do not touch (they use
      # `<name>_test`), so it needs its own migration first.
      - run: pnpm db:migrate
      # Runs the compiled server, which the unit and e2e tests do not (they run TypeScript sources).
      - run: pnpm --filter api smoke

  build:
    name: Build and image build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Check the built site for external references
        run: pnpm --filter web check:assets
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t flagboard-api:ci .
      - name: Build the web image
        run: docker build -f apps/web/Dockerfile -t flagboard-web:ci .

  browser:
    name: Browser test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: flagboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Create the roles
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v dbname="$POSTGRES_DB" \
            -v migrator_password="$FLAGBOARD_MIGRATOR_PASSWORD" \
            -v app_password="$FLAGBOARD_APP_PASSWORD" \
            -f infra/postgres/init-roles.sql
      - name: Build, migrate and seed
        run: |
          pnpm build
          pnpm db:migrate
          pnpm db:seed
      - name: Install the browser
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Keep the report when the test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

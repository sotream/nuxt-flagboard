name: Dependency audit

# Not part of CI: an advisory published tomorrow must not turn yesterday's green pull request red. It runs on
# a schedule and on demand, and is not a required check.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Audit production dependencies
        run: pnpm audit --prod
